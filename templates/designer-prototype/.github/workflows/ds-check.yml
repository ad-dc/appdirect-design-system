# Prototype CI: typecheck + ds-audit.
# Restricted @mantine/core imports fail the job.
# Missing PageContentHeader / handmade record lists warn via GitHub annotations.
name: DS check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        id: install
        run: npm install
      - name: Typecheck
        if: ${{ steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: DS audit
        if: ${{ steps.install.outcome == 'success' }}
        run: npm run ds:audit
      - name: Upload prototype-audit.json
        if: ${{ steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: prototype-audit
          path: prototype-audit.json
          if-no-files-found: ignore
